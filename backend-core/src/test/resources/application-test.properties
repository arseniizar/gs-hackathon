spring.application.name=backend-core-test

# Use separate storage and embedded Mongo database for tests
hackathon.storage.upload-dir=./uploads-test
spring.data.mongodb.database=hackathondb-test
de.flapdoodle.mongodb.embedded.version=6.0.6

# JWT/worker placeholders so context loads
hackathon.jwt.secret=test-jwt-secret-which-is-long-enough-1234567
hackathon.jwt.expiration-ms=3600000
worker.secret=test-worker-secret
worker.api.url=http://localhost:9999
