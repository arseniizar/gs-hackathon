# application.properties
spring.application.name=backend-core
server.port=8080

# MongoDB - local dev
spring.data.mongodb.uri=mongodb://localhost:27017/hackathondb

# Hackathon settings
hackathon.jwt.secret=super-secret-jwt-key-please-change-1234567890
hackathon.jwt.expiration-ms=3600000
hackathon.storage.upload-dir=./uploads
hackathon.max-file-size-bytes=52428800  # 50 MB

# Logging
logging.level.org.springframework=INFO