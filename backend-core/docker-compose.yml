version: "3.8"

services:
  mongo:
    image: mongo:7.0
    container_name: hackathon-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: hackathondb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo-data: